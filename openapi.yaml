openapi: 3.0.3
info:
  title: Mock CRM API
  version: 1.0.0
  description: Local Mock CRM collection protocol specification
servers:
  - url: /
    description: Mock CRM server root
paths:
  /v1/companies:
    get:
      summary: List companies
      operationId: getCompanies
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: since
          in: query
          description: Inclusive cutoff as non-negative decimal Unix epoch milliseconds
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Successful collection retrieval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          headers:
            Retry-After-Ms:
              description: Delay in milliseconds before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
          headers:
            Retry-After-Ms:
              description: Delay in milliseconds before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

